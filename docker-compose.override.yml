# docker-compose.override.yml — local development overrides
# Activated automatically when you run `docker compose up` locally.
# Do NOT commit secrets here.

version: "3.9"

services:
  agent:
    # Hot-reload: mount source so code changes are reflected without rebuild
    volumes:
      - ./app:/app/app
      - ./prompts:/app/prompts
      - ./secrets:/secrets:ro
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG

  # pgAdmin for local database browsing (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - agent_net
    profiles:
      - tools  # Only starts with: docker compose --profile tools up
